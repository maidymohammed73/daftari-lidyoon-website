    <!-- Apply saved language + theme before first paint (prevents a flash). -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          // URL params (?lang=en&theme=dark) win over saved preferences — handy for sharing links.
          var q = new URLSearchParams(location.search);
          var l = q.get('lang') || localStorage.getItem('dl-lang');
          if (l === 'en') {
            d.lang = 'en';
            d.dir = 'ltr';
          }
          var t = q.get('theme') || localStorage.getItem('dl-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            d.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
